name: Tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - run: sh -n scripts/install.sh && sh -n scripts/update.sh
      - run: cp .env.example .env && docker compose config --quiet
      - run: docker compose -f setup.compose.yaml config --quiet
      - run: docker build -t nas-device-flow-controller:0.1.0-rc.5 .
      - run: docker run --rm --network none --cap-drop ALL -v "$PWD:/release:ro" --entrypoint python3 nas-device-flow-controller:0.1.0-rc.5 /release/scripts/container_smoke.py
      - run: docker run --rm --network none --cap-drop ALL --cap-add DAC_OVERRIDE --cap-add CHOWN -e NDF_SMOKE_FOREIGN_UID=1000 -v "$PWD:/release:ro" --entrypoint python3 nas-device-flow-controller:0.1.0-rc.5 /release/scripts/container_smoke.py
      - run: sudo bash scripts/isolated-dhcp-test.sh
  publish-image:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Verify tag and choose image name
        id: image
        env:
          VERSION_TAG: ${{ github.ref_name }}
        run: |
          python3 -c 'import json,os; assert os.environ["VERSION_TAG"] == "v" + json.load(open("SOURCE-MANIFEST.json"))["version"]'
          owner=$(printf '%s' "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')
          echo "name=ghcr.io/$owner/nas-device-flow-controller:${VERSION_TAG#v}" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: ${{ steps.image.outputs.name }}
          labels: |
            org.opencontainers.image.source=https://github.com/AzBuildDev/nas-device-flow
            org.opencontainers.image.version=${{ github.ref_name }}
      - name: Export image for NAS GUI import
        env:
          IMAGE: ${{ steps.image.outputs.name }}
          VERSION_TAG: ${{ github.ref_name }}
        run: |
          docker pull "$IMAGE"
          docker save "$IMAGE" | gzip > "nas-device-flow-${VERSION_TAG#v}-controller-amd64.tar.gz"
      - uses: actions/upload-artifact@v4
        with:
          name: controller-image-${{ github.ref_name }}
          path: nas-device-flow-*-controller-amd64.tar.gz
          retention-days: 7
