name: Tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - run: cp .env.example .env && docker compose config --quiet
      - run: docker build -t nas-device-flow-controller:0.1.0-rc.3 .
      - run: docker run --rm --network none --cap-drop ALL -v "$PWD:/release:ro" --entrypoint python3 nas-device-flow-controller:0.1.0-rc.3 /release/scripts/container_smoke.py
      - run: sudo bash scripts/isolated-dhcp-test.sh
